<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#667eea">
<title>记账小工具</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif;background:#f5f5f5;color:#333;min-height:100vh;padding-bottom:64px}
  .page{display:none;padding:12px 16px;min-height:100vh}
  .page.active{display:block}
  .status-bar{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:10px 16px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;border-radius:0 0 12px 12px;margin-bottom:10px}
  .budget-card{background:#fff;border-radius:10px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .budget-card .budget-label{font-size:12px;color:#888;margin-bottom:4px}
  .budget-card .budget-value{font-size:20px;font-weight:700}
  .budget-card .budget-percent{font-size:12px;color:#ff9800;margin-top:2px}
  .budget-card .budget-alert{font-size:12px;color:#f44336;margin-top:2px;font-weight:600}
  .progress-bar{height:6px;background:#e0e0e0;border-radius:3px;margin:8px 0 4px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,#4caf50,#ff9800);border-radius:3px;transition:width .3s;width:0}
  .progress-fill.over{background:linear-gradient(90deg,#f44336,#ff9800)}
  .form-group{margin-bottom:14px}
  .form-label{font-size:13px;color:#666;margin-bottom:4px;font-weight:500;display:block}
  .form-input,.form-select,.form-textarea{width:100%;padding:11px 14px;border:1px solid #ddd;border-radius:8px;font-size:15px;font-family:inherit;background:#fff}
  .form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:#667eea}
  .toggle-row{display:flex;gap:20px;margin-bottom:14px}
  .toggle-row label{font-size:15px;font-weight:600;color:#666;cursor:pointer;padding:6px 14px;border-radius:20px;background:#f0f0f0;transition:.2s}
  .toggle-row input[type="radio"]{display:none}
  .toggle-row input[type="radio"]:checked+label{background:#667eea;color:#fff;box-shadow:0 2px 6px rgba(102,126,234,.4)}
  .amount-row{display:flex;gap:10px}
  .amount-row .form-input{flex:1}
  .amount-row .currency{padding:11px 14px;background:#f0f0f0;border-radius:8px 0 0 8px;border:1px solid #ddd;border-right:none;font-size:15px;color:#666;flex:0 0 52px;text-align:center}
  .category-select{cursor:pointer;appearance:none;background-repeat:no-repeat;background-position:right 12px center;padding-right:32px}
  .btn-save{width:100%;padding:14px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px;box-shadow:0 4px 12px rgba(102,126,234,.3)}
  .btn-save:active{transform:scale(.98)}
  .manage-row{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
  .btn-text{padding:8px 14px;background:#fff;border:1px solid #ddd;border-radius:8px;font-size:13px;color:#666;cursor:pointer}
  .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100}
  .modal{background:#fff;border-radius:14px;padding:22px;width:90%;max-width:320px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
  .modal h3{font-size:16px;margin-bottom:12px}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
  .btn-secondary{padding:8px 16px;background:#f0f0f0;border:none;border-radius:8px;font-size:14px;cursor:pointer}
  .btn-primary{padding:8px 16px;background:#667eea;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer}
  .filter-bar{display:flex;gap:8px;margin-bottom:12px}
  .filter-chip{padding:6px 14px;background:#fff;border:1px solid #ddd;border-radius:20px;font-size:13px;cursor:pointer;white-space:nowrap}
  .filter-chip.active{background:#667eea;color:#fff;border-color:#667eea}
  .tx-list{list-style:none}
  .tx-item{background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.06);display:flex;justify-content:space-between;align-items:center}
  .tx-item.expense{border-left:3px solid #f44336}
  .tx-item.income{border-left:3px solid #4caf50}
  .tx-item .tx-left{display:flex;flex-direction:column;gap:2px}
  .tx-item .tx-cat{font-size:14px;font-weight:600}
  .tx-item .tx-date{font-size:11px;color:#999}
  .tx-item .tx-amount{font-size:15px;font-weight:700;white-space:nowrap}
  .tx-item.expense .tx-amount{color:#f44336}
  .tx-item.income .tx-amount{color:#4caf50}
  .tx-note{font-size:11px;color:#bbb;margin-top:1px}
  .monthly-summary{background:#fff;border-radius:10px;padding:14px 16px;margin-top:10px;display:flex;justify-content:space-around;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .summary-item .label{font-size:11px;color:#888;margin-bottom:4px}
  .summary-item .value{font-size:18px;font-weight:700}
  .summary-item.income .value{color:#4caf50}
  .summary-item.expense .value{color:#f44336}
  .chart-container{background:#fff;border-radius:10px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06);position:relative;height:220px}
  .chart-container canvas{max-width:100%}
  .detail-table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:10px;overflow:hidden}
  .detail-table th{background:#f0f0f0;padding:10px 12px;text-align:left;font-weight:600;color:#555}
  .detail-table td{padding:10px 12px;border-bottom:1px solid #eee}
  .detail-table td.amt{text-align:right;font-weight:600;color:#f44336}
  .detail-table th.amt{color:#555}
  .tab-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;z-index:50}
  .tab-btn{flex:1;text-align:center;padding:10px 0;font-size:12px;font-weight:500;color:#999;background:none;border:none;cursor:pointer;transition:.2s}
  .tab-btn.active{color:#667eea;border-bottom:2px solid #667eea}
  .tab-btn .icon{display:block;font-size:20px;margin-bottom:2px}
  .toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.78);color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}
  .empty-state{text-align:center;padding:60px 20px;color:#999;font-size:13px}
  .empty-state .icon{font-size:48px;margin-bottom:10px}
  .backup-row{display:flex;gap:10px;margin-top:12px}
  .backup-row button{flex:1;padding:11px;background:#fff;border:1px solid #ddd;border-radius:8px;font-size:13px;color:#555;cursor:pointer}
  .backup-row label{flex:1;padding:11px;background:#fff;border:1px solid #ddd;border-radius:8px;font-size:13px;color:#555;cursor:pointer;text-align:center}
  .cat-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
  .cat-del{color:#f44336;cursor:pointer;font-size:12px}
</style>
</head>
<body>
<div id="page-记账" class="page active">
  <div class="status-bar"><span>📝 记账</span><span id="budget-mini">本月预算：--</span></div>
  <div class="budget-card">
    <div class="budget-label">本月预算进度</div>
    <div class="progress-bar"><div class="progress-fill" id="budget-fill"></div></div>
    <div class="budget-value" id="budget-val">¥0.00 / ¥0.00</div>
    <div class="budget-percent" id="budget-percent"></div>
    <div class="budget-alert" id="budget-alert" style="display:none">⚠️ 已超支！请节制</div>
  </div>
  <div class="toggle-row">
    <input type="radio" name="txType" id="type-income" value="income"><label for="type-income">💰 收入</label>
    <input type="radio" name="txType" id="type-expense" value="expense" checked><label for="type-expense">📉 支出</label>
  </div>
  <div class="form-group"><label class="form-label">金额</label><div class="amount-row"><div class="currency">¥</div><input type="number" id="tx-amount" class="form-input" placeholder="0.00" inputmode="decimal" min="0.01" step="0.01"></div></div>
  <div class="form-group"><label class="form-label">日期</label><input type="date" id="tx-date" class="form-input"></div>
  <div class="form-group"><label class="form-label">分类</label><select id="tx-category" class="form-select category-select"></select></div>
  <div class="form-group"><label class="form-label">备注</label><input type="text" id="tx-note" class="form-textarea" placeholder="简要说明（可选）"></div>
  <button class="btn-save" id="btn-save">📸 记一笔</button>
  <div class="manage-row"><button class="btn-text" id="btn-manage-cat">管理分类</button></div>
</div>

<div id="page-记录" class="page">
  <div class="status-bar"><span>📋 记录</span><span id="budget-mini-2">本月预算：--</span></div>
  <div class="budget-card">
    <div class="budget-label">本月预算进度</div>
    <div class="progress-bar"><div class="progress-fill" id="budget-fill-2"></div></div>
    <div class="budget-value" id="budget-val-2">¥0.00 / ¥0.00</div>
    <div class="budget-percent" id="budget-percent-2"></div>
    <div class="budget-alert" id="budget-alert-2" style="display:none">⚠️ 已超支！请节制</div>
  </div>
  <div class="filter-bar">
    <button class="filter-chip active" data-filter="all">全部</button>
    <button class="filter-chip" data-filter="income">收入</button>
    <button class="filter-chip" data-filter="expense">支出</button>
  </div>
  <div id="tx-list"></div>
  <div class="monthly-summary" id="monthly-summary" style="display:none">
    <div class="summary-item income"><div class="label">📥 收入</div><div class="value" id="sum-income">¥0</div></div>
    <div class="summary-item expense"><div class="label">📤 支出</div><div class="value" id="sum-expense">¥0</div></div>
    <div class="summary-item"><div class="label">💵 结余</div><div class="value" id="sum-balance">¥0</div></div>
  </div>
  <div class="backup-row">
    <button id="btn-export">导出备份</button>
    <label for="btn-import">恢复备份</label>
    <input type="file" id="btn-import" accept="application/json" style="display:none">
  </div>
</div>

<div id="page-统计" class="page">
  <div class="status-bar"><span>📊 统计</span><span id="budget-mini-3">本月预算：--</span></div>
  <div class="budget-card">
    <div class="budget-label">本月预算进度</div>
    <div class="progress-bar"><div class="progress-fill" id="budget-fill-3"></div></div>
    <div class="budget-value" id="budget-val-3">¥0.00 / ¥0.00</div>
    <div class="budget-percent" id="budget-percent-3"></div>
    <div class="budget-alert" id="budget-alert-3" style="display:none">⚠️ 已超支！请节制</div>
  </div>
  <div class="chart-container"><canvas id="pieChart"></canvas></div>
  <div class="chart-container"><canvas id="barChart"></canvas></div>
  <table class="detail-table"><thead><tr><th>分类</th><th class="amt">金额</th><th class="amt">笔数</th></tr></thead><tbody id="detail-tbody"></tbody></table>
</div>

<div class="tab-bar">
  <button class="tab-btn active" data-tab="记账"><span class="icon">📝</span>记账</button>
  <button class="tab-btn" data-tab="记录"><span class="icon">📋</span>记录</button>
  <button class="tab-btn" data-tab="统计"><span class="icon">📊</span>统计</button>
</div>

<div class="modal-overlay" id="modal-cat" style="display:none">
  <div class="modal">
    <h3>📋 管理分类</h3>
    <p style="font-size:12px;color:#888;margin-bottom:6px">支出自定义分类</p>
    <div id="cat-items-exp" style="max-height:120px;overflow-y:auto"></div>
    <p style="font-size:12px;color:#888;margin:10px 0 6px">收入自定义分类</p>
    <div id="cat-items-inc" style="max-height:120px;overflow-y:auto"></div>
    <input type="text" id="new-cat-name" class="form-input" style="margin-top:10px" placeholder="输入新分类名称">
    <div class="modal-actions">
      <button class="btn-secondary" id="btn-cancel-cat">关闭</button>
      <button class="btn-primary" id="btn-add-cat">添加</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";

var KEY = "money_tracker_v1";
var data = null;
var currentType = "expense";
var currentFilter = "all";
var pieInstance = null, barInstance = null;

/* ---------- 工具函数 ---------- */
function pad2(n){ return n < 10 ? "0" + n : "" + n; }
function monthOf(d){ return d.getFullYear() + "-" + pad2(d.getMonth() + 1); }
function dateOf(d){ return monthOf(d) + "-" + pad2(d.getDate()); }
function thisMonth(){ return monthOf(new Date()); }

function money(v){
  var n = Number(v) || 0;
  var s = Math.abs(n).toFixed(2);
  var parts = s.split(".");
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return parts.join(".");
}
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove("show"); }, 2000);
}

/* ---------- 数据层 ---------- */
function defaultData(){
  return {
    version: "1.0",
    budget: { month: thisMonth(), total: 5000 },
    transactions: [],
    categories: {
      income: ["工资", "兼职", "理财", "压岁钱"],
      expense: ["餐饮", "交通", "购物", "娱乐", "住房", "医疗", "其他"]
    },
    custom: { income: [], expense: [] }
  };
}

function normalize(o){
  var d = defaultData();
  if(!o || typeof o !== "object"){ return d; }

  if(o.budget && typeof o.budget === "object"){
    var bt = Number(o.budget.total);
    if(bt > 0){ d.budget.total = bt; }
    if(o.budget.month){ d.budget.month = String(o.budget.month); }
  }

  if(Array.isArray(o.transactions)){
    d.transactions = o.transactions.filter(function(t){
      return t && t.date && t.category;
    }).map(function(t){
      return {
        id: t.id ? String(t.id) : "tx_" + Math.random().toString(36).slice(2, 10),
        date: String(t.date),
        type: t.type === "income" ? "income" : "expense",
        category: String(t.category),
        amount: Math.abs(Number(t.amount) || 0),
        note: t.note ? String(t.note) : "",
        createdAt: Number(t.createdAt) || 0
      };
    });
  }

  if(o.categories && typeof o.categories === "object"){
    if(Array.isArray(o.categories.income) && o.categories.income.length){
      d.categories.income = o.categories.income.map(String);
    }
    if(Array.isArray(o.categories.expense) && o.categories.expense.length){
      d.categories.expense = o.categories.expense.map(String);
    }
  }

  if(o.custom && typeof o.custom === "object"){
    if(Array.isArray(o.custom.income)){ d.custom.income = o.custom.income.map(String); }
    if(Array.isArray(o.custom.expense)){ d.custom.expense = o.custom.expense.map(String); }
  }

  return d;
}

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw){ return defaultData(); }
    return normalize(JSON.parse(raw));
  }catch(e){
    console.warn("读取数据失败，使用默认数据", e);
    return defaultData();
  }
}

function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(data));
  }catch(e){
    toast("⚠️ 保存失败，存储空间可能已满");
    console.error(e);
  }
}

/* ---------- 业务计算 ---------- */
function allCategories(type){
  return data.categories[type].concat(data.custom[type] || []);
}

function monthExpenseTotal(){
  var mo = thisMonth();
  return data.transactions.reduce(function(sum, t){
    if(t.type === "expense" && t.date.slice(0, 7) === mo){
      return sum + Number(t.amount);
    }
    return sum;
  }, 0);
}

function lastMonths(n){
  var res = [];
  var now = new Date();
  for(var i = n - 1; i >= 0; i--){
    var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    res.push(monthOf(d));
  }
  return res;
}

/* ---------- 表单 ---------- */
function fillCategorySelect(){
  var sel = document.getElementById("tx-category");
  if(!sel){ return; }
  var prev = sel.value;
  sel.innerHTML = "";
  allCategories(currentType).forEach(function(c){
    var o = document.createElement("option");
    o.value = c;
    o.textContent = c;
    sel.appendChild(o);
  });
  if(prev){
    var hit = allCategories(currentType).indexOf(prev);
    if(hit !== -1){ sel.value = prev; }
  }
}

function addTx(){
  var amountEl = document.getElementById("tx-amount");
  var dateEl = document.getElementById("tx-date");
  var catEl = document.getElementById("tx-category");
  var noteEl = document.getElementById("tx-note");

  var amount = parseFloat(amountEl.value);
  var date = dateEl.value;
  var category = catEl.value;
  var note = noteEl.value.trim();

  if(!amount || amount <= 0){ toast("请输入有效金额"); amountEl.focus(); return; }
  if(!date){ toast("请选择日期"); return; }
  if(!category){ toast("请选择分类"); return; }

  data.transactions.push({
    id: "tx_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
    date: date,
    type: currentType,
    category: category,
    amount: Math.round(amount * 100) / 100,
    note: note,
    createdAt: Date.now()
  });
  save();

  amountEl.value = "";
  noteEl.value = "";
  refreshAll();
  toast("✅ 已记入：" + category + " " + (currentType === "income" ? "+" : "-") + "¥" + money(amount));
}

/* ---------- 渲染：预算 ---------- */
function updateBudget(){
  var total = Number(data.budget.total) || 0;
  var used = monthExpenseTotal();
  var pct = total > 0 ? (used / total) * 100 : 0;
  var text = "¥" + money(used) + " / ¥" + money(total);

  ["budget-val", "budget-val-2", "budget-val-3"].forEach(function(id){
    var e = document.getElementById(id);
    if(e){ e.textContent = text; }
  });

  ["budget-mini", "budget-mini-2", "budget-mini-3"].forEach(function(id){
    var e = document.getElementById(id);
    if(e){ e.textContent = "本月预算：¥" + money(used) + " / ¥" + money(total); }
  });

  ["budget-fill", "budget-fill-2", "budget-fill-3"].forEach(function(id){
    var e = document.getElementById(id);
    if(e){
      e.style.width = Math.min(pct, 100) + "%";
      if(pct >= 100){ e.classList.add("over"); } else { e.classList.remove("over"); }
    }
  });

  ["budget-percent", "budget-percent-2", "budget-percent-3"].forEach(function(id){
    var e = document.getElementById(id);
    if(e){
      e.textContent = pct >= 100
        ? "已超支 " + Math.round(pct) + "%"
        : Math.round(pct) + "%";
      e.style.color = pct >= 100 ? "#f44336" : "#ff9800";
    }
  });

  ["budget-alert", "budget-alert-2", "budget-alert-3"].forEach(function(id){
    var e = document.getElementById(id);
    if(e){ e.style.display = pct >= 100 ? "block" : "none"; }
  });
}

/* ---------- 渲染：记录列表 ---------- */
function renderList(){
  var list = document.getElementById("tx-list");
  var summary = document.getElementById("monthly-summary");
  if(!list){ return; }

  var mo = thisMonth();
  var items = data.transactions.slice().sort(function(a, b){
    var byDate = String(b.date).localeCompare(String(a.date));
    if(byDate !== 0){ return byDate; }
    return (b.createdAt || 0) - (a.createdAt || 0);
  });

  if(currentFilter !== "all"){
    items = items.filter(function(t){ return t.type === currentFilter; });
  }

  list.innerHTML = "";

  if(items.length === 0){
    list.innerHTML = '<div class="empty-state"><div class="icon">📭</div>暂无记录<br>去记账页记一笔吧</div>';
    if(summary){ summary.style.display = "none"; }
    return;
  }

  if(summary){ summary.style.display = "flex"; }

  var monthItems = items.filter(function(t){ return String(t.date).slice(0, 7) === mo; });
  var inc = 0, exp = 0;
  monthItems.forEach(function(t){
    if(t.type === "income"){ inc += Number(t.amount); }
    else { exp += Number(t.amount); }
  });

  var sumInc = document.getElementById("sum-income");
  var sumExp = document.getElementById("sum-expense");
  var sumBal = document.getElementById("sum-balance");
  if(sumInc){ sumInc.textContent = "¥" + money(inc); }
  if(sumExp){ sumExp.textContent = "¥" + money(exp); }
  if(sumBal){ sumBal.textContent = "¥" + money(inc - exp); }

  var frag = document.createDocumentFragment();
  items.forEach(function(t){
    var div = document.createElement("div");
    div.className = "tx-item " + (t.type === "income" ? "income" : "expense");
    var sign = t.type === "income" ? "+" : "-";
    var notePart = t.note ? " · " + esc(t.note) : "";
    div.innerHTML =
      '<div class="tx-left">' +
        '<span class="tx-cat">' + esc(t.category) + '</span>' +
        '<span class="tx-date">' + esc(t.date) + notePart + '</span>' +
      '</div>' +
      '<span class="tx-amount">' + sign + "¥" + money(t.amount) + '</span>';
    frag.appendChild(div);
  });
  list.appendChild(frag);
}

/* ---------- 渲染：图表 + 明细表 ---------- */
function drawCharts(){
  var pieCanvas = document.getElementById("pieChart");
  var barCanvas = document.getElementById("barChart");
  if(!pieCanvas || !barCanvas){ return; }

  if(typeof Chart === "undefined"){
    var holder = pieCanvas.parentNode;
    if(holder){ holder.innerHTML = '<div style="color:#999;font-size:13px;text-align:center;padding:60px 0">图表库加载失败<br>请联网后刷新重试</div>'; }
    return;
  }

  var mo = thisMonth();

  var byCat = {};
  data.transactions.forEach(function(t){
    if(t.type === "expense" && String(t.date).slice(0, 7) === mo){
      byCat[t.category] = (byCat[t.category] || 0) + Number(t.amount);
    }
  });
  var labels = Object.keys(byCat);
  var values = labels.map(function(k){ return byCat[k]; });

  var palette = ["#f44336", "#e91e63", "#9c27b0", "#673ab7", "#3f51b5",
                 "#1e88e5", "#42a5f5", "#26a69a", "#66bb6a", "#ffa726"];

  if(pieInstance){ try{ pieInstance.destroy(); }catch(e){} pieInstance = null; }
  if(barInstance){ try{ barInstance.destroy(); }catch(e){} barInstance = null; }

  if(labels.length === 0){
    pieInstance = new Chart(pieCanvas, {
      type: "doughnut",
      data: { labels: ["本月暂无支出"], datasets: [{ data: [1], backgroundColor: ["#e0e0e0"], borderWidth: 0 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { enabled: false } } }
    });
  } else {
    pieInstance = new Chart(pieCanvas, {
      type: "doughnut",
      data: {
        labels: labels,
        datasets: [{ data: values, backgroundColor: palette.slice(0, labels.length), borderWidth: 0 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 11 }, padding: 8 } },
          tooltip: { callbacks: { label: function(ctx){ return " " + ctx.label + "：¥" + money(ctx.parsed); } } }
        }
      }
    });
  }

  var months = lastMonths(6);
  var incArr = months.map(function(m){
    return data.transactions.reduce(function(s, t){
      return (t.type === "income" && String(t.date).slice(0, 7) === m) ? s + Number(t.amount) : s;
    }, 0);
  });
  var expArr = months.map(function(m){
    return data.transactions.reduce(function(s, t){
      return (t.type === "expense" && String(t.date).slice(0, 7) === m) ? s + Number(t.amount) : s;
    }, 0);
  });
  var shortLabels = months.map(function(m){ return m.slice(5) + "月"; });

  barInstance = new Chart(barCanvas, {
    type: "bar",
    data: {
      labels: shortLabels,
      datasets: [
        { label: "支出", data: expArr, backgroundColor: "#f44336" },
        { label: "收入", data: incArr, backgroundColor: "#4caf50" }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 11 } } },
        tooltip: { callbacks: { label: function(ctx){ return " " + ctx.dataset.label + "：¥" + money(ctx.parsed.y); } } }
      },
      scales: {
        y: { beginAtZero: true, ticks: { font: { size: 10 }, maxTicksLimit: 5 } },
        x: { ticks: { font: { size: 10 } }, grid: { display: false } }
      }
    }
  });

  var tbody = document.getElementById("detail-tbody");
  if(!tbody){ return; }
  tbody.innerHTML = "";

  if(labels.length === 0){
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#999;padding:20px">本月暂无支出</td></tr>';
    return;
  }

  var rows = labels.map(function(k){ return { cat: k, amt: byCat[k] }; })
                   .sort(function(a, b){ return b.amt - a.amt; });

  var frag = document.createDocumentFragment();
  rows.forEach(function(r){
    var count = data.transactions.filter(function(t){
      return t.type === "expense" && String(t.date).slice(0, 7) === mo && t.category === r.cat;
    }).length;
    var tr = document.createElement("tr");
    tr.innerHTML = "<td>" + esc(r.cat) + "</td>" +
                   '<td class="amt">¥' + money(r.amt) + "</td>" +
                   '<td class="amt" style="color:#666">' + count + "</td>";
    frag.appendChild(tr);
  });
  tbody.appendChild(frag);
}

function refreshAll(){
  updateBudget();
  renderList();
  var statsPage = document.getElementById("page-统计");
  if(statsPage && statsPage.classList.contains("active")){
    drawCharts();
  }
}

/* ---------- 分类管理 ---------- */
function renderCatModal(){
  ["exp", "inc"].forEach(function(kind){
    var type = kind === "inc" ? "income" : "expense";
    var box = document.getElementById("cat-items-" + kind);
    if(!box){ return; }
    box.innerHTML = "";
    var list = data.custom[type] || [];
    if(list.length === 0){
      box.innerHTML = '<div style="color:#bbb;font-size:12px;padding:6px 0">暂无自定义分类</div>';
      return;
    }
    list.forEach(function(name, idx){
      var row = document.createElement("div");
      row.className = "cat-row";
      row.innerHTML = "<span>" + esc(name) + "</span>" +
        '<span class="cat-del" data-type="' + type + '" data-idx="' + idx + '">删除</span>';
      box.appendChild(row);
    });
  });
}

function openCatModal(){
  renderCatModal();
  var input = document.getElementById("new-cat-name");
  if(input){ input.value = ""; }
  document.getElementById("modal-cat").style.display = "flex";
}

/* ---------- 备份 ---------- */
function exportBackup(){
  try{
    var payload = JSON.stringify(data, null, 2);
    var blob = new Blob([payload], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "记账备份_" + thisMonth() + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    toast("✅ 备份已导出");
  }catch(e){
    toast("❌ 导出失败");
    console.error(e);
  }
}

function importBackup(evt){
  var input = evt.target;
  var file = input.files && input.files[0];
  if(!file){ return; }

  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var obj = JSON.parse(e.target.result);
      if(!obj || !Array.isArray(obj.transactions)){ throw new Error("结构不正确"); }
      data = normalize(obj);
      save();
      fillCategorySelect();
      refreshAll();
      toast("✅ 备份已恢复");
    }catch(err){
      console.error(err);
      toast("❌ 文件格式不正确");
    }finally{
      input.value = "";
    }
  };
  reader.onerror = function(){
    toast("❌ 读取文件失败");
    input.value = "";
  };
  reader.readAsText(file);
}

/* ---------- Tab 切换 ---------- */
function switchTab(name){
  var btns = document.querySelectorAll(".tab-btn");
  for(var i = 0; i < btns.length; i++){
    btns[i].classList.toggle("active", btns[i].getAttribute("data-tab") === name);
  }
  var pages = document.querySelectorAll(".page");
  for(var j = 0; j < pages.length; j++){
    pages[j].classList.toggle("active", pages[j].id === "page-" + name);
  }
  if(name === "记录"){ renderList(); }
  if(name === "统计"){ updateBudget(); drawCharts(); }
}

/* ---------- 事件绑定 ---------- */
function bindEvents(){
  /* 记账 */
  document.getElementById("btn-save").addEventListener("click", addTx);

  document.getElementById("tx-amount").addEventListener("keydown", function(e){
    if(e.key === "Enter"){ addTx(); }
  });

  /* 收支切换 */
  ["type-income", "type-expense"].forEach(function(id){
    document.getElementById(id).addEventListener("change", function(e){
      currentType = e.target.value;
      fillCategorySelect();
    });
  });

  /* 底部 Tab */
  var tabBar = document.querySelector(".tab-bar");
  if(tabBar){
    tabBar.addEventListener("click", function(e){
      var btn = e.target.closest(".tab-btn");
      if(btn){ switchTab(btn.getAttribute("data-tab")); }
    });
  }

  /* 记录筛选 */
  var chips = document.querySelectorAll(".filter-chip");
  for(var i = 0; i < chips.length; i++){
    (function(chip){
      chip.addEventListener("click", function(){
        var all = document.querySelectorAll(".filter-chip");
        for(var k = 0; k < all.length; k++){ all[k].classList.remove("active"); }
        chip.classList.add("active");
        currentFilter = chip.getAttribute("data-filter");
        renderList();
      });
    })(chips[i]);
  }

  /* 分类管理弹窗 */
  document.getElementById("btn-manage-cat").addEventListener("click", openCatModal);
  document.getElementById("btn-cancel-cat").addEventListener("click", function(){
    document.getElementById("modal-cat").style.display = "none";
  });

  document.getElementById("modal-cat").addEventListener("click", function(e){
    var del = e.target.closest(".cat-del");
    if(!del){ return; }
    var type = del.getAttribute("data-type");
    var idx = parseInt(del.getAttribute("data-idx"), 10);
    if(!type || isNaN(idx)){ return; }
    data.custom[type].splice(idx, 1);
    save();
    renderCatModal();
    fillCategorySelect();
    toast("已删除分类");
  });

  document.getElementById("btn-add-cat").addEventListener("click", function(){
    var input = document.getElementById("new-cat-name");
    var name = input.value.trim();
    if(!name){ toast("请输入分类名"); input.focus(); return; }
    if(allCategories(currentType).indexOf(name) !== -1){ toast("该分类已存在"); return; }
    data.custom[currentType].push(name);
    save();
    input.value = "";
    renderCatModal();
    fillCategorySelect();
    document.getElementById("tx-category").value = name;
    toast("✅ 已添加分类：" + name);
  });

  /* 预算点击修改 */
  ["budget-val", "budget-val-2", "budget-val-3"].forEach(function(id){
    var el = document.getElementById(id);
    if(!el){ return; }
    el.style.cursor = "pointer";
    el.title = "点击设置本月预算";
    el.addEventListener("click", function(){
      var cur = Number(data.budget.total) || 0;
      var v = window.prompt("设置本月预算总额（元）", String(cur));
      if(v === null){ return; }
      var n = parseFloat(v);
      if(!n || n <= 0){ toast("请输入有效金额"); return; }
      data.budget.total = Math.round(n * 100) / 100;
      save();
      refreshAll();
      toast("✅ 预算已更新为 ¥" + money(data.budget.total));
    });
  });

  /* 备份 */
  document.getElementById("btn-export").addEventListener("click", exportBackup);
  document.getElementById("btn-import").addEventListener("change", importBackup);
}

/* ---------- 启动 ---------- */
function init(){
  data = load();
  save();

  var dateEl = document.getElementById("tx-date");
  if(dateEl){ dateEl.value = dateOf(new Date()); }

  fillCategorySelect();
  bindEvents();
  refreshAll();
}

if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}

})();
</script>
</body>
</html>
